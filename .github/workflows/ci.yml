# CI: Python tests, bash syntax, web backend tests, frontend build, Docker images.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-agent.txt -r requirements-web.txt

      - name: Repository & agent tests
        run: python -m pytest tests/ -q --tb=short

      - name: Web backend tests
        run: cd web/backend && python -m pytest tests/ -q --tb=short

      - name: Bash syntax (roadmap-agent.sh)
        run: bash -n scripts/unix/roadmap-agent.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Frontend build
        run: |
          cd web/frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (CLI image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: roadmap-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build (web image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: false
          tags: rma-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
