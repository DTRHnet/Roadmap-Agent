# Build and push Docker images to GitHub Container Registry (ghcr.io).
# - Version tags v* (e.g. v1.1.1-b): push roadmap-agent + roadmap-agent-web as :tag, :x.y.z (no v), and :latest
# - workflow_dispatch: push both images with a custom tag (default: edge)
name: Docker publish

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for both images (manual runs only)"
        required: false
        default: edge

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner (GHCR)
        id: ns
        run: echo "namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          NS="${{ steps.ns.outputs.namespace }}"
          CLI_BASE="${{ env.REGISTRY }}/${NS}/roadmap-agent"
          WEB_BASE="${{ env.REGISTRY }}/${NS}/roadmap-agent-web"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            T="${GITHUB_REF#refs/tags/}"
            V="${T#v}"
            {
              echo "cli<<CLI_EOF"
              echo "${CLI_BASE}:${T}"
              echo "${CLI_BASE}:${V}"
              echo "${CLI_BASE}:latest"
              echo "CLI_EOF"
              echo "web<<WEB_EOF"
              echo "${WEB_BASE}:${T}"
              echo "${WEB_BASE}:${V}"
              echo "${WEB_BASE}:latest"
              echo "WEB_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            MT="${{ github.event.inputs.tag }}"
            if [[ -z "$MT" ]]; then
              MT="edge"
            fi
            {
              echo "cli<<CLI_EOF"
              echo "${CLI_BASE}:${MT}"
              echo "CLI_EOF"
              echo "web<<WEB_EOF"
              echo "${WEB_BASE}:${MT}"
              echo "WEB_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node (SPA for web image)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Frontend production build
        run: |
          cd web/frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.cli }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.web }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
