<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .title { fill: #58a6ff; font: bold 28px monospace; }
    .text { fill: #c9d1d9; font: 16px monospace; }
    .accent { fill: #3fb950; font: 16px monospace; }
    .dim { fill: #8b949e; font: 14px monospace; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1000" height="520" rx="12"></rect>

  <!-- Panel -->
  <rect class="panel" x="40" y="40" width="920" height="440" rx="10"></rect>

  <!-- Title -->
  <text class="title" x="60" y="85">ROADMAP-AGENT CLI</text>

  <!-- Subtitle -->
  <text class="dim" x="60" y="115">Local AI Memory Palace + Roadmap Workflow</text>

  <!-- Divider -->
  <line x1="60" y1="130" x2="940" y2="130" stroke="#30363d"></line>

  <!-- Menu -->
  <text class="accent" x="60" y="170">I   Init Project (.rma bootstrap)</text>
  <text class="text" x="60" y="200">II  Status (branch + task summary)</text>
  <text class="text" x="60" y="230">III Plan (generate roadmap)</text>
  <text class="text" x="60" y="260">IV  Analyze (sync artifacts)</text>
  <text class="text" x="60" y="290">V   Execute One Task</text>
  <text class="text" x="60" y="320">VI  Unlock State</text>
  <text class="text" x="60" y="350">VII Persistence Check</text>

  <!-- Right panel -->
  <rect class="panel" x="520" y="150" width="400" height="250" rx="8"></rect>

  <text class="accent" x="540" y="190">.rma/</text>
  <text class="dim" x="540" y="220">description.md</text>
  <text class="dim" x="540" y="245">ui.md</text>
  <text class="dim" x="540" y="270">stack.md</text>
  <text class="dim" x="540" y="295">other.md</text>
  <text class="dim" x="540" y="320">roadmaps/</text>
  <text class="dim" x="540" y="345">state/ logs/ mempalace/</text>

  <!-- Footer -->
  <text class="dim" x="60" y="440">Cross-platform • Script-first • fzf-powered • Memory-driven workflows</text>
</svg>