# Optional local web UI. Intended for Linux/macOS hosts; on Windows prefer native
# Python + web/run-backend.ps1 so rma can reach Git Bash/WSL.
services:
  rma-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      RMA_WEB_HOST: "0.0.0.0"
      PORT: "8765"
      # Optional: require token for PUT/POST
      # RMA_WEB_ADMIN_TOKEN: "change-me"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 25s
